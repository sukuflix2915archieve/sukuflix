<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukuFlix - Streaming Forever ❤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1>SukuFlix ❤</h1>
        <p>Streaming Forever</p>

        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="checkPassword()">Enter</button>
    </div>
</div>

<div id="main-content" style="display:none;">

    <div class="hearts"></div>

    <header>
        <h1>SukuFlix ❤</h1>
    </header>

    <section class="hero">
        <img src="profile.JPG" alt="Profile">
        <h2>Streaming Forever ❤</h2>
        <p>A collection of our favorite memories.</p>
    </section>

    <section class="category">
        <h2>Favorite Moments</h2>
        <div class="cards">
            <div class="card">Video 1</div>
            <div class="card">Video 2</div>
            <div class="card">Video 3</div>
        </div>
    </section>

    <section class="category">
        <h2>Photo Gallery</h2>
        <div class="cards">
            <div class="card">Photo 1</div>
            <div class="card">Photo 2</div>
            <div class="card">Photo 3</div>
        </div>
    </section>

</div>

<script src="script.js"></script>

</body>
</html>
